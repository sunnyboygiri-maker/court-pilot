<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background:#1d3557;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:600;">{{ app_name }}</td></tr>
<tr><td style="padding:24px;font-size:15px;line-height:1.5;">
{% block content %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 24px;font-size:12px;color:#7b8794;border-top:1px solid #e4e7eb;">
{% block footer %}Case data is sourced from eCourts and may lag the court's records. Always verify with the court before relying on it.<br>
You receive this because you track cases on {{ app_name }}.{% endblock %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>

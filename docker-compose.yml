x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://courtpilot:${POSTGRES_PASSWORD:-courtpilot}@postgres:5432/courtpilot
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    # Migrations run here once; worker/beat wait for the API to be healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Reminders, digests and change alerts (default "celery" queue)
  worker:
    <<: *app
    command: celery -A workers.celery_app worker -Q celery -n notify@%h -l info --concurrency 2
    depends_on:
      api:
        condition: service_healthy

  # eCourts polling, kept apart so slow lookups never delay reminders
  poller:
    <<: *app
    command: celery -A workers.celery_app worker -Q polling -n poll@%h -l info --concurrency 4
    depends_on:
      api:
        condition: service_healthy

  # "Find a case" searches and first fetches of cases added from them
  searcher:
    <<: *app
    command: celery -A workers.celery_app worker -Q search -n search@%h -l info --concurrency 2
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *app
    # Schedule state lives in /tmp so the container user can write it
    command: celery -A workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy

  # Development only: long-polls Telegram. In production set TELEGRAM_WEBHOOK_URL
  # instead and the API receives updates itself. Start with --profile polling.
  bot:
    <<: *app
    command: python -m bot.telegram_bot
    profiles: ["polling"]
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: courtpilot
      POSTGRES_USER: courtpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtpilot}
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtpilot -d courtpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
